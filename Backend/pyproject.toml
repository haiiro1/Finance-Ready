[project]
name = "finance-ready-backend"
version = "0.1.0"
description = "Backend for Finance Ready personal finance platform."
authors = [{ name = "Gemini Code Assist", email = "no-reply@google.com" }]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlmodel",
    "alembic",
    "psycopg[binary]",
]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.uv.sources]
finance-ready-backend = { path = "." }